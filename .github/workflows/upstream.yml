name: upstream versions

# Fails on purpose when a package is behind upstream, so that the usual
# "workflow failed" notification is the version bump reminder.  Manual runs
# and pull requests only print the report.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/latest-version.sh
      - .github/workflows/upstream.yml

jobs:
  zcode:
    name: zcode vs upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        env:
          # A manual run or PR may not have a branch to compare against; the
          # step then reports instead of failing.
          FAIL_ON_DRIFT: ${{ github.event_name == 'schedule' }}
        run: |
          # %bin-version, not %version.  scripts/latest-version.sh scrapes the
          # product page for the Linux .deb, which is the %bin-version source;
          # %version is the git tag the source package builds from, and it is
          # deliberately allowed to lag (see the comment above %bin-version in
          # sane-packages/zcode.scm).  Comparing %version against the .deb
          # scraper reported drift that is not drift.
          #
          # The definition is split over two lines by `guix style' (the value
          # goes on its own line), so read the line after the define and strip
          # the quotes and the closing paren.
          packaged="$(awk '/^\(define %bin-version/ { getline; gsub(/["() \t]/, ""); print; exit }' \
                        sane-packages/zcode.scm)"
          if [ -z "${packaged}" ]; then
            echo "::error::could not read %bin-version from sane-packages/zcode.scm"
            exit 1
          fi
          upstream="$(./scripts/latest-version.sh)"
          if [ -z "${upstream}" ]; then
            echo "::error::scripts/latest-version.sh printed nothing"
            exit 1
          fi
          echo "packaged: ${packaged}   upstream: ${upstream}"
          if [ "${packaged}" != "${upstream}" ]; then
            echo "::error::zcode-bin ${packaged} is behind upstream ${upstream}"
            if [ "${FAIL_ON_DRIFT}" = "true" ]; then
              exit 1
            fi
          fi
